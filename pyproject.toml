[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decupa"
version = "0.5.0"
description = "MCP that sees and hears footage (takes, b-roll, contact sheets) and hands frame-accurate cuts to Premiere / Resolve"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bernardo Traad" }]
keywords = ["mcp", "video", "editing", "premiere", "davinci-resolve", "whisper", "footage", "logging"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.27,<2",
  "numpy",
  "pillow",
  "faster-whisper>=1.1",
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "xxhash",
]

[project.urls]
Homepage = "https://github.com/bernardotraad/decupa"

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
decupa = "decupa.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decupa = ["panel_premiere/*", "panel_premiere/CSXS/*"]
