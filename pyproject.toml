[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudio"
version = "0.8.0"
description = "Cláudio, o Editor — an MCP that sees and hears footage (takes, b-roll, contact sheets) and hands frame-accurate cuts to Premiere / Resolve"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bernardo Traad" }]
keywords = ["mcp", "video", "editing", "premiere", "davinci-resolve", "whisper", "footage", "logging"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.27,<2",
  "numpy",
  "pillow",
  "faster-whisper>=1.1",
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "xxhash",
  "onnxruntime",          # CLIP visual search (find_shot), CPU
  "huggingface_hub",
  "tokenizers",
  "opencv-python-headless",  # faces (YuNet + SFace)
  "sherpa-onnx",            # voices (WeSpeaker)
]

[project.urls]
Homepage = "https://github.com/bernardotraad/claudio"

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
motion = ["playwright", "edge-tts"]
test = ["pytest"]

[project.scripts]
claudio = "claudio.server:main"
claudio-panel = "claudio.panel:main"
claudio-doctor = "claudio.doctor:main"
claudio-index = "claudio.indexer:cli"
claudio-run = "claudio.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claudio = ["panel_premiere/*", "panel_premiere/CSXS/*", "ae/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
