[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decupa"
version = "0.2.0"
description = "MCP that sees and hears footage (takes, b-roll, contact sheets) and hands frame-accurate cuts to Premiere / Resolve"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.27,<2",
  "numpy",
  "pillow",
  "faster-whisper>=1.1",
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
decupa = "decupa.server:main"

[tool.setuptools.packages.find]
where = ["src"]
