<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cláudio, o Editor</title>
<style>
  /* Cláudio, o Editor — an edit-suite look: clapperboard slate, a bin of colour-labelled actions (Premiere's own label
     palette, the same colours multicam gives each camera) and the conversation laid out like items on a timeline. */
  :root {
    --bg:#141312; --bg2:#1a1917; --card:#211f1d; --card2:#282522; --line:#2e2b28; --line2:#3b3733;
    --text:#ece6dc; --dim:#a39a8f; --faint:#6e675f;
    --cerulean:#2ba3dc; --mango:#f0962c; --forest:#5fa94c; --magenta:#d4529f; --yellow:#e6cf3a;
    --violet:#a68ae0; --teal:#2db3a6; --rose:#e8768f; --caribbean:#22c4a0; --lavender:#c8a2e8;
    --you:var(--mango); --cl:var(--cerulean);
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
    --mono:"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:12.5px/1.5 var(--sans); }
  #app { display:flex; flex-direction:column; height:100%; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:var(--line2); border-radius:4px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }

  /* ── slate ─────────────────────────────────────────── */
  header { background:var(--bg2); border-bottom:1px solid var(--line); }
  .clap { height:7px; background:repeating-linear-gradient(-55deg,
      var(--cerulean) 0 12px, var(--bg) 12px 18px, var(--mango) 18px 30px, var(--bg) 30px 36px,
      var(--forest) 36px 48px, var(--bg) 48px 54px, var(--magenta) 54px 66px, var(--bg) 66px 72px,
      var(--yellow) 72px 84px, var(--bg) 84px 90px, var(--violet) 90px 102px, var(--bg) 102px 108px); }
  body.busy .clap { animation:roll 1.2s linear infinite; }
  @keyframes roll { to { background-position:-132px 0; } }
  .brand { display:flex; align-items:baseline; gap:7px; padding:9px 12px 6px; white-space:nowrap; min-width:0; }
  .brand .name { font:italic 600 21px/1 var(--serif); letter-spacing:.2px; }
  .brand .sub { font:10px/1 var(--mono); text-transform:uppercase; letter-spacing:2.5px; color:var(--dim); }
  .rec { width:7px; height:7px; border-radius:50%; background:var(--faint); align-self:center; margin-left:2px; }
  body.busy .rec { background:#ff4d3d; box-shadow:0 0 0 3px rgba(255,77,61,.18); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .ghost { margin-left:auto; background:none; border:1px solid var(--line2); border-radius:2px; padding:3px 8px;
           font:10px/1.4 var(--mono); text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .ghost:hover:not(:disabled) { color:var(--text); border-color:var(--dim); }
  .slate { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; margin:0 12px 10px; border:1px solid var(--line2); }
  .slate > div { padding:4px 7px 5px; min-width:0; }
  .slate > div + div { border-left:1px solid var(--line2); }
  .slate label { display:block; font:9px/1.3 var(--mono); text-transform:uppercase; letter-spacing:1.6px; color:var(--faint); }
  .slate span { display:block; font:12px/1.35 var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #s-tc { color:var(--yellow); }

  /* ── bin of actions ────────────────────────────────── */
  .binhead { display:flex; align-items:center; gap:8px; padding:7px 12px 0; font:9px/1 var(--mono); text-transform:uppercase;
             letter-spacing:1.8px; color:var(--faint); cursor:pointer; user-select:none; }
  .binhead::after { content:""; flex:1; height:1px; background:var(--line); }
  .binhead .tw { transition:transform .15s; }
  body.binshut .binhead .tw { transform:rotate(-90deg); }
  #quick { display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:3px; padding:7px 12px 10px;
           border-bottom:1px solid var(--line); }
  body.binshut #quick { display:none; }
  #quick h6 { grid-column:1/-1; margin:5px 0 0; display:flex; align-items:center; gap:6px; font:9px/1 var(--mono);
              text-transform:uppercase; letter-spacing:1.6px; color:var(--c); opacity:.85; }
  #quick h6:first-child { margin-top:0; }
  #quick h6::after { content:""; flex:1; height:1px; background:var(--line); }
  body.binshut .binhead { padding-bottom:7px; border-bottom:1px solid var(--line); }
  #quick button { position:relative; text-align:left; background:var(--card); border:0; border-left:3px solid var(--c);
                  padding:5px 7px 5px 7px; border-radius:0 2px 2px 0; overflow:hidden; min-height:32px;
                  display:flex; align-items:center; gap:6px; }
  #quick button::before { content:""; position:absolute; top:0; right:0; bottom:0; left:0; background:var(--c); opacity:0; transition:opacity .12s; }
  #quick button:hover:not(:disabled)::before { opacity:.13; }
  #quick button i { position:relative; font:normal 9px/1 var(--mono); color:var(--c); letter-spacing:.5px; }
  #quick button span { position:relative; font-size:11px; line-height:1.2; }
  #quick button.loc::after, .binhead .legend::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--teal); }
  #quick button.loc::after { position:absolute; right:6px; top:6px; }
  .binhead .legend { display:flex; align-items:center; gap:5px; order:2; text-transform:none; letter-spacing:.3px; }
  .msg.local { --c:var(--teal); }
  .msg.local.err { --c:var(--rose); }
  .model { background:transparent; color:var(--dim); border:1px solid var(--line2); border-radius:2px; font:10px/1.3 var(--mono);
           padding:3px 4px; text-transform:uppercase; letter-spacing:.6px; }
  .model.toggle { cursor:pointer; }
  .model.toggle[aria-pressed="true"] { color:var(--teal); border-color:var(--teal); }

  /* ── conversation as a timeline ────────────────────── */
  #log { flex:1; overflow-y:auto; padding:12px 12px 6px; display:flex; flex-direction:column; gap:10px; }
  #log:empty::before { content:"Escolha uma ação no bin acima ou escreva o que quer.\A O Cláudio vê o material, propõe e pergunta antes de mexer na sua timeline.";
                       white-space:pre-line; margin:auto 6px; text-align:center; color:var(--faint); font:italic 14px/1.6 var(--serif); }
  #log > * { flex-shrink:0; }               /* never squeeze a message when the log overflows */
  .msg { position:relative; padding-left:11px; }
  .msg::before { content:""; position:absolute; left:0; top:2px; bottom:2px; width:3px; border-radius:1px; background:var(--c, var(--line2)); }
  .msg.user { --c:var(--you); }
  .msg.claude { --c:var(--cl); }
  .msg.err { --c:var(--rose); }
  .hd { display:flex; align-items:baseline; gap:8px; margin-bottom:2px; font:9.5px/1.2 var(--mono); text-transform:uppercase; letter-spacing:1.6px; }
  .hd b { color:var(--c); font-weight:600; }
  .hd time { color:var(--faint); }
  .bd { word-wrap:break-word; }
  .user .bd { white-space:pre-wrap; color:#f6efe4; }
  .bd p { margin:0 0 6px; } .bd p:last-child { margin-bottom:0; }
  .bd h4 { margin:8px 0 4px; font:italic 600 14px/1.3 var(--serif); }
  .bd ul, .bd ol { margin:2px 0 6px; padding-left:18px; } .bd li { margin:1px 0; }
  .bd li::marker { color:var(--faint); }
  .bd b { color:#fff7ea; font-weight:600; }
  .bd code { font:11px/1.4 var(--mono); background:var(--card2); padding:1px 4px; border-radius:2px; color:#f3d9a8; overflow-wrap:anywhere; }
  .bd pre { margin:4px 0 6px; padding:7px 8px; background:var(--card); border:1px solid var(--line); font:11px/1.45 var(--mono);
            white-space:pre-wrap; overflow-wrap:anywhere; color:#e6dccb; }
  .bd blockquote { margin:4px 0; padding:2px 0 2px 9px; border-left:2px solid var(--line2); color:var(--dim); font-style:italic; }
  .bd table { border-collapse:collapse; margin:4px 0 7px; font-size:11.5px; display:block; overflow-x:auto; max-width:100%; }
  .bd table::-webkit-scrollbar { height:4px; } .bd table::-webkit-scrollbar-thumb { background:var(--line2); }
  .bd th { text-align:left; font:9px/1.3 var(--mono); text-transform:uppercase; letter-spacing:1.2px; color:var(--dim);
           border-bottom:1px solid var(--line2); padding:3px 10px 3px 0; white-space:nowrap; }
  .bd td { border-bottom:1px solid var(--line); padding:3px 10px 3px 0; vertical-align:top; }
  .bd td code, .bd td .lab { white-space:nowrap; }
  .sw { display:inline-block; width:9px; height:9px; margin-right:5px; vertical-align:-1px; border-radius:1px; }
  .msg.tool { padding-left:13px; margin:-5px 0 0; font:10.5px/1.5 var(--mono); color:var(--dim); white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .msg.tool::before { left:1px; top:50%; bottom:auto; width:6px; height:6px; margin-top:-3px; border-radius:0; transform:rotate(45deg);
                      background:var(--teal); opacity:.8; }
  .msg.tool + .msg.tool { margin-top:-8px; }
  .msg.shot { padding-left:11px; }
  .msg.shot::before { background:var(--teal); opacity:.6; }
  .msg.shot img { display:block; max-width:100%; max-height:150px; border:1px solid var(--line2); cursor:zoom-in; }
  .bd a { color:var(--cerulean); text-decoration:underline; text-decoration-color:rgba(43,163,220,.45); text-underline-offset:2px;
          cursor:pointer; overflow-wrap:anywhere; }
  .bd a:hover { text-decoration-color:var(--cerulean); }
  #zoom { position:fixed; top:0; right:0; bottom:0; left:0; z-index:50; background:rgba(10,9,8,.94); display:flex;
          align-items:center; justify-content:center; padding:34px 8px 8px; cursor:zoom-out; }
  #zoom img { max-width:100%; max-height:100%; object-fit:contain; border:1px solid var(--line2); cursor:zoom-in; }
  #zoom.full { display:block; overflow:auto; }
  #zoom.full img { max-width:none; max-height:none; cursor:zoom-out; }
  #zoom .zbar { position:fixed; top:6px; right:8px; display:flex; gap:5px; }
  #zoom .zbar button { background:var(--card2); border:1px solid var(--line2); border-radius:2px; padding:3px 8px;
                       font:10px/1.4 var(--mono); text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  #zoom .zbar button:hover { color:var(--text); border-color:var(--dim); }
  .msg.user.more { --c:var(--yellow); }
  .msg.meta { align-self:stretch; display:flex; align-items:center; gap:8px; padding:0; font:10px/1.35 var(--mono);
              letter-spacing:.3px; color:var(--faint); text-align:center; overflow-wrap:anywhere; }
  .msg.meta::before, .msg.meta::after { content:""; position:static; flex:1; min-width:14px; height:1px; width:auto; background:var(--line); }
  .msg button { display:block; margin-top:7px; background:var(--card2); border:1px solid var(--line2); border-left:3px solid var(--yellow);
                border-radius:0 2px 2px 0; padding:5px 9px; font:11px/1.3 var(--mono); text-align:left; }
  .msg button:hover:not(:disabled) { border-color:var(--yellow); }
  .msg button.primary { border-left-color:var(--mango); }
  .msg br + button { margin-top:4px; }

  /* ── progress as a ruler with a playhead ───────────── */
  #prog { display:none; padding:7px 12px 9px; border-top:1px solid var(--line); background:var(--bg2); }
  #prog .txt { font:10.5px/1.4 var(--mono); color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #prog .bar { position:relative; height:12px; margin-top:5px; background:
      repeating-linear-gradient(90deg, var(--line2) 0 1px, transparent 1px 10%) left bottom/100% 5px no-repeat,
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 2%) left bottom/100% 3px no-repeat, var(--card); }
  #prog .fill { position:relative; height:100%; width:0; transition:width .6s;
                background:repeating-linear-gradient(-55deg, rgba(43,163,220,.55) 0 5px, rgba(43,163,220,.35) 5px 10px); }
  #prog .fill::after { content:""; position:absolute; right:-1px; top:-3px; bottom:-1px; width:2px; background:#ff4d3d; }
  #prog.done .fill { background:rgba(95,169,76,.5); } #prog.done .fill::after { display:none; }
  #prog.bad .fill { background:rgba(232,118,143,.45); }

  /* ── composer ─────────────────────────────────────── */
  #status { font:10.5px/1.4 var(--mono); color:var(--dim); padding:0 12px 5px; min-height:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  body.busy #status::after { content:"▍"; color:var(--cl); animation:blink 1s steps(2) infinite; margin-left:2px; }
  footer { padding:0 12px 12px; }
  .composer { background:var(--card); border:1px solid var(--line2); border-radius:2px; transition:border-color .12s; }
  .composer:focus-within { border-color:var(--you); }
  textarea { display:block; width:100%; resize:none; height:58px; background:transparent; color:var(--text); border:0; outline:0;
             padding:8px 9px 2px; font:12.5px/1.45 var(--sans); }
  textarea::placeholder { color:var(--faint); font-style:italic; font-family:var(--serif); font-size:13.5px; }
  .actions { display:flex; align-items:center; gap:6px; padding:4px 5px 5px 9px; min-width:0; }
  .hint { font:9.5px/1 var(--mono); color:var(--faint); letter-spacing:1px; text-transform:uppercase; margin-right:auto;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  @media (max-width: 340px) { .hint { display:none; } .model { margin-right:auto; } .send { padding:5px 9px; }
    .actions { flex-wrap:wrap; row-gap:5px; } .send { margin-left:auto; } }
  @media (max-width: 480px) { .hint { display:none; } #stop { margin-left:auto; } }
  .actions button, .model { white-space:nowrap; }
  .actions .ghost { margin-left:0; }
  .send { background:var(--you); color:#1a1209; border:0; border-radius:2px; padding:5px 13px; font:600 10.5px/1.3 var(--mono);
          text-transform:uppercase; letter-spacing:1.4px; }
  .send:hover:not(:disabled) { filter:brightness(1.08); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="clap"></div>
    <div class="brand">
      <span class="name">Cláudio</span><span class="sub">o Editor</span><span class="rec" title="trabalhando"></span>
      <button id="newchat" class="ghost" title="Começar uma conversa nova">＋ nova</button>
    </div>
    <div class="slate">
      <div><label>projeto</label><span id="s-proj">lendo…</span></div>
      <div><label>sequência</label><span id="s-seq">—</span></div>
      <div><label>playhead</label><span id="s-tc">--:--</span></div>
    </div>
  </header>
  <div class="binhead" id="binhead"><span class="tw">▾</span>bin · ações<span class="legend" title="Rodam nesta máquina, sem usar a IA (sem crédito)">sem IA</span></div>
  <nav id="quick">
    <h6 style="--c:var(--cerulean)">preparar</h6>
    <button data-q="index" class="loc" style="--c:var(--cerulean)"><i>01</i><span>Analisar material</span></button>
    <button data-q="status" class="loc" style="--c:var(--cerulean)"><i>02</i><span>Status</span></button>
    <button data-q="stereo" class="loc" style="--c:var(--cerulean)"><i>03</i><span>Áudio estéreo</span></button>
    <button data-q="multicam" class="loc" style="--c:var(--cerulean)"><i>04</i><span>Multicam</span></button>
    <h6 style="--c:var(--violet)">entender</h6>
    <button data-q="overview" style="--c:var(--violet)"><i>05</i><span>Visão geral</span></button>
    <button data-q="describe" class="loc" style="--c:var(--violet)"><i>06</i><span>Descrever planos</span></button>
    <button data-q="notes" style="--c:var(--violet)"><i>07</i><span>Ler minhas notas</span></button>
    <h6 style="--c:var(--forest)">montar</h6>
    <button data-q="selects" style="--c:var(--forest)"><i>08</i><span>Selects</span></button>
    <button data-q="autocut" style="--c:var(--forest)" title="Corta a multicâmera sincronizada por quem está falando"><i>09</i><span>Corte por quem fala</span></button>
    <button data-q="recap" style="--c:var(--forest)" title="Aftermovie do evento: melhores momentos no beat da música"><i>10</i><span>Recap de evento</span></button>
    <button data-q="clean" class="loc" style="--c:var(--forest)" title="Tira pausas e vícios da fala de uma sequência já montada (sequência nova)"><i>11</i><span>Limpar falas</span></button>
    <button data-q="sfx" class="loc" style="--c:var(--forest)" title="Whoosh nas entradas de b-roll e pop nas palavras-chave (trilha de áudio nova)"><i>12</i><span>SFX nos cortes</span></button>
    <button data-q="music" style="--c:var(--forest)" title="Escolhe a trilha no Storyblocks com você, baixa na pasta de trilhas do trabalho e coloca numa trilha de áudio nova de cada sequência, com o final da música no fim do corte e ducking sob as falas"><i>13</i><span>Trilha sonora</span></button>
    <button data-q="flatten" class="loc" style="--c:var(--forest)"><i>14</i><span>Desaninhar</span></button>
    <h6 style="--c:var(--magenta)">legendar</h6>
    <button data-q="stt" class="loc" style="--c:var(--magenta)" title="Liga/desliga a transcrição pelo ElevenLabs Scribe (pago, tempo da palavra a 1–2 frames da voz) e refaz a legenda das sequências que foram transcritas pelo Whisper"><i>15</i><span id="stt-label">Transcrição Scribe</span></button>
    <button data-q="captions" style="--c:var(--magenta)"><i>16</i><span>Legendas</span></button>
    <button data-q="captions_final" style="--c:var(--magenta)" title="Depois de corrigir a legenda na trilha de legenda do Premiere (o Cláudio lê direto da sequência)"><i>17</i><span>Overlay da legenda revisada</span></button>
    <button data-q="captions_mogrt" class="loc" style="--c:var(--magenta)" title="Uma legenda MOGRT por bloco, editável no Premiere (usa a legenda que você corrigiu na sequência)"><i>18</i><span>Legenda MOGRT</span></button>
    <h6 style="--c:var(--rose)">entregar</h6>
    <button data-q="qc" class="loc" style="--c:var(--rose)"><i>19</i><span>QC antes de exportar</span></button>
    <button data-q="vault" style="--c:var(--rose)"><i>20</i><span>Registrar no vault</span></button>
  </nav>
  <div id="log"></div>
  <div id="prog"><div class="txt"></div><div class="bar"><div class="fill"></div></div></div>
  <div id="status"></div>
  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Diga ao Cláudio o que você quer deste material…"></textarea>
      <div class="actions">
        <select id="model" class="model" title="Modelo da IA nesta conversa (os botões 'sem IA' não usam nenhum)">
          <option value="haiku">Econômico</option><option value="sonnet" selected>Padrão</option><option value="opus">Máximo</option>
        </select>
        <button id="conn" class="model toggle" aria-pressed="false" title="Liga os conectores do claude.ai (Vault, Storyblocks…) em toda mensagem. Desligado, eles só entram quando a mensagem fala em vault ou stock — e cada mensagem gasta menos.">Vault·Stock</button>
        <span class="hint">Ctrl+Enter</span>
        <button id="stop" class="ghost" disabled>■ parar</button>
        <button id="send" class="send">Enviar</button>
      </div>
    </div>
  </footer>
</div>
<script src="main.js"></script>
</body>
</html>
