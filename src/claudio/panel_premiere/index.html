<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cláudio, o Editor</title>
<style>
  :root { --bg:#1d1d1d; --panel:#262626; --line:#353535; --text:#e6e6e6; --muted:#9a9a9a; --accent:#4ea1ff; --ok:#5cc46a; --warn:#e3b341; --err:#ef5b5b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:12px/1.45 "Segoe UI",system-ui,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:8px 10px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  header b { font-size:13px; letter-spacing:.3px; }
  #ctx { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  #quick { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 8px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  button.import { margin-top:6px; }
  #log { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:7px 9px; border-radius:6px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:#2d3a4a; align-self:flex-end; max-width:90%; }
  .claude { background:var(--panel); }
  .tool { color:var(--muted); font-size:11px; padding:2px 4px; }
  .tool::before { content:"⚙ "; }
  .err { color:var(--err); }
  .meta { color:var(--muted); font-size:10px; align-self:center; }
  footer { border-top:1px solid var(--line); padding:8px 10px; display:flex; gap:6px; }
  textarea { flex:1; resize:none; height:56px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px; font:inherit; }
  #status { font-size:11px; color:var(--muted); padding:0 10px 6px; min-height:16px; }
  #prog { display:none; padding:6px 10px 8px; border-top:1px solid var(--line); }
  #prog .bar { height:6px; background:var(--panel); border-radius:3px; overflow:hidden; margin-top:4px; }
  #prog .fill { height:100%; width:0; background:var(--accent); transition:width .6s; }
  #prog .txt { font-size:11px; color:var(--text); }
  #prog.done .fill { background:var(--ok); }
  #prog.bad .fill { background:var(--err); }
</style>
</head>
<body>
<div id="app">
  <header><b>Cláudio</b><span id="ctx">lendo o projeto…</span><button id="newchat" title="Nova conversa">＋</button></header>
  <div id="quick">
    <button data-q="index">Analisar material</button>
    <button data-q="overview">Visão geral</button>
    <button data-q="selects">Selects</button>
    <button data-q="notes">Ler minhas notas</button>
    <button data-q="captions">Legendas</button>
    <button data-q="qc">QC antes de exportar</button>
    <button data-q="status">Status</button>
    <button data-q="vault">Registrar no vault</button>
  </div>
  <div id="log"></div>
  <div id="prog"><div class="txt"></div><div class="bar"><div class="fill"></div></div></div>
  <div id="status"></div>
  <footer>
    <textarea id="input" placeholder="Fale com o Claude sobre este projeto… (Ctrl+Enter envia)"></textarea>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button id="send" class="primary">Enviar</button>
      <button id="stop" disabled>Parar</button>
    </div>
  </footer>
</div>
<script src="main.js"></script>
</body>
</html>
